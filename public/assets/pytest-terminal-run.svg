<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="50%" stop-color="#0A0B0E"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B6FF3C" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B6FF3C" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="passedGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B6FF3C" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#B6FF3C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#B6FF3C" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="neonFilter" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#B6FF3C" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes line1 { 0%, 2% { opacity: 0; transform: translateY(3px); } 4%, 93% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    @keyframes line2 { 0%, 7% { opacity: 0; transform: translateY(3px); } 9%, 93% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    @keyframes line3 { 0%, 11% { opacity: 0; transform: translateY(3px); } 13%, 93% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    @keyframes line4 { 0%, 15% { opacity: 0; transform: translateY(3px); } 17%, 93% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
    
    @keyframes test1 { 0%, 20% { opacity: 0; transform: translateX(-4px); } 23%, 93% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; } }
    @keyframes test2 { 0%, 25% { opacity: 0; transform: translateX(-4px); } 28%, 93% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; } }
    @keyframes test3 { 0%, 30% { opacity: 0; transform: translateX(-4px); } 33%, 93% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; } }
    @keyframes test4 { 0%, 35% { opacity: 0; transform: translateX(-4px); } 38%, 93% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; } }
    @keyframes test5 { 0%, 40% { opacity: 0; transform: translateX(-4px); } 43%, 93% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; } }
    @keyframes test6 { 0%, 45% { opacity: 0; transform: translateX(-4px); } 48%, 93% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; } }
    @keyframes test7 { 0%, 50% { opacity: 0; transform: translateX(-4px); } 53%, 93% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; } }

    @keyframes summary { 0%, 56% { opacity: 0; transform: scale(0.99); } 59%, 93% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; } }
    @keyframes promptFinal { 0%, 62% { opacity: 0; } 64%, 93% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes livePulse { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }

    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .l1 { animation: line1 10s infinite; }
    .l2 { animation: line2 10s infinite; }
    .l3 { animation: line3 10s infinite; }
    .l4 { animation: line4 10s infinite; }

    .t1 { animation: test1 10s infinite; }
    .t2 { animation: test2 10s infinite; }
    .t3 { animation: test3 10s infinite; }
    .t4 { animation: test4 10s infinite; }
    .t5 { animation: test5 10s infinite; }
    .t6 { animation: test6 10s infinite; }
    .t7 { animation: test7 10s infinite; }

    .summary-box { animation: summary 10s infinite; transform-origin: 440px 355px; }
    .final-prompt { animation: promptFinal 10s infinite; }
    .cursor { animation: cursorBlink 0.9s infinite; }
    .pulse-dot { animation: livePulse 2s infinite ease-in-out; transform-origin: 820px 20px; }
  </style>

  <!-- Window Container -->
  <rect x="2" y="2" width="876" height="432" rx="12" fill="url(#cardBg)" stroke="url(#neonBorder)" stroke-width="1.5"/>

  <!-- Top Window Title Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 866 2 Q 878 2 878 14 L 878 38 L 2 38 Z" fill="#13161D"/>
  <line x1="2" y1="38" x2="878" y2="38" stroke="#232936" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="22" cy="20" r="5.5" fill="#FF5F56"/>
  <circle cx="40" cy="20" r="5.5" fill="#FFBD2E"/>
  <circle cx="58" cy="20" r="5.5" fill="#27C93F"/>

  <!-- Window Title -->
  <text x="440" y="24" fill="#9CA3AF" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle" letter-spacing="0.4">
    shafiq@qa-runner: ~/portfolio-test-suite (pytest-v9.1.1 · headless)
  </text>

  <!-- Live Status Badge -->
  <g class="pulse-dot">
    <circle cx="818" cy="20" r="4.5" fill="#B6FF3C"/>
  </g>
  <text x="830" y="24" fill="#B6FF3C" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8">LIVE</text>

  <!-- Terminal Content Area -->
  <g class="mono" transform="translate(28, 0)">
    
    <!-- Command Line -->
    <g class="l1" transform="translate(0, 64)">
      <text fill="#B6FF3C" font-weight="800">❯</text>
      <text x="18" fill="#F3F4F6" font-weight="600">pytest -v tests/ --tb=short --chrome-headless</text>
    </g>

    <!-- Session Start Header -->
    <g class="l2" transform="translate(0, 89)">
      <text fill="#6B7280">============================= test session starts =============================</text>
    </g>

    <!-- Environment details -->
    <g class="l3" transform="translate(0, 111)">
      <text fill="#9CA3AF">platform </text>
      <text x="74" fill="#B6FF3C" font-weight="600">win32</text>
      <text x="122" fill="#9CA3AF">-- Python </text>
      <text x="194" fill="#60A5FA" font-weight="600">3.11.8</text>
      <text x="244" fill="#9CA3AF">, pytest-</text>
      <text x="309" fill="#60A5FA" font-weight="600">9.1.1</text>
      <text x="349" fill="#9CA3AF">, selenium-</text>
      <text x="434" fill="#60A5FA" font-weight="600">4.46.0</text>
    </g>

    <!-- Rootdir -->
    <g class="l4" transform="translate(0, 133)">
      <text fill="#9CA3AF">rootdir: </text>
      <text x="68" fill="#F3F4F6">/tests/shafiq-ahamed-portfolio</text>
      <text x="315" fill="#6B7280">| collected </text>
      <text x="402" fill="#B6FF3C" font-weight="700">7 items</text>
    </g>

    <!-- Test 1 -->
    <g class="t1" transform="translate(0, 166)">
      <text fill="#E5E7EB">tests/test_engineer.py::test_fresher_credentials</text>
      <text x="440" fill="#374151">····················</text>
      <text x="640" fill="#B6FF3C" font-weight="700" filter="url(#neonFilter)">PASSED</text>
      <text x="735" fill="#9CA3AF">[ 14%]</text>
    </g>

    <!-- Test 2 -->
    <g class="t2" transform="translate(0, 190)">
      <text fill="#E5E7EB">tests/test_skills.py::test_selenium_locators_waits</text>
      <text x="440" fill="#374151">····················</text>
      <text x="640" fill="#B6FF3C" font-weight="700" filter="url(#neonFilter)">PASSED</text>
      <text x="735" fill="#9CA3AF">[ 28%]</text>
    </g>

    <!-- Test 3 -->
    <g class="t3" transform="translate(0, 214)">
      <text fill="#E5E7EB">tests/test_projects.py::test_100_automated_tests</text>
      <text x="440" fill="#374151">····················</text>
      <text x="640" fill="#B6FF3C" font-weight="700" filter="url(#neonFilter)">PASSED</text>
      <text x="735" fill="#9CA3AF">[ 42%]</text>
    </g>

    <!-- Test 4 -->
    <g class="t4" transform="translate(0, 238)">
      <text fill="#E5E7EB">tests/test_testrun.py::test_screen_recording_video</text>
      <text x="440" fill="#374151">····················</text>
      <text x="640" fill="#B6FF3C" font-weight="700" filter="url(#neonFilter)">PASSED</text>
      <text x="735" fill="#9CA3AF">[ 57%]</text>
    </g>

    <!-- Test 5 -->
    <g class="t5" transform="translate(0, 262)">
      <text fill="#E5E7EB">tests/test_journey.py::test_discipline_milestones</text>
      <text x="440" fill="#374151">····················</text>
      <text x="640" fill="#B6FF3C" font-weight="700" filter="url(#neonFilter)">PASSED</text>
      <text x="735" fill="#9CA3AF">[ 71%]</text>
    </g>

    <!-- Test 6 -->
    <g class="t6" transform="translate(0, 286)">
      <text fill="#E5E7EB">tests/test_github.py::test_qa_journey_telemetry</text>
      <text x="440" fill="#374151">····················</text>
      <text x="640" fill="#B6FF3C" font-weight="700" filter="url(#neonFilter)">PASSED</text>
      <text x="735" fill="#9CA3AF">[ 85%]</text>
    </g>

    <!-- Test 7 -->
    <g class="t7" transform="translate(0, 310)">
      <text fill="#E5E7EB">tests/test_contact.py::test_recruiter_pipeline</text>
      <text x="440" fill="#374151">····················</text>
      <text x="640" fill="#B6FF3C" font-weight="700" filter="url(#neonFilter)">PASSED</text>
      <text x="735" fill="#9CA3AF">[100%]</text>
    </g>

    <!-- Final Summary Banner -->
    <g class="summary-box" transform="translate(0, 338)">
      <rect x="-8" y="0" width="836" height="32" rx="6" fill="url(#passedGlow)" stroke="#B6FF3C" stroke-opacity="0.4" stroke-width="1"/>
      <text x="410" y="21" fill="#B6FF3C" font-weight="800" text-anchor="middle" letter-spacing="0.5" filter="url(#neonFilter)">
        ==================== 7 passed, 0 failed, 0 flaky in 1.28s ====================
      </text>
    </g>

    <!-- Final Prompt line with blinking cursor -->
    <g class="final-prompt" transform="translate(0, 396)">
      <text fill="#B6FF3C" font-weight="800">❯</text>
      <text x="18" fill="#9CA3AF">All test assertions passed. Ready for interview &amp; deployment</text>
      <rect x="475" y="-12" width="8" height="15" fill="#B6FF3C" class="cursor"/>
    </g>

  </g>
</svg>
